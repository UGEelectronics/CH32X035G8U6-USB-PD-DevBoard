name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/.nojekyll _site/.nojekyll
          cp "PCB For CH32X035G8U6 USB PD Development Board Assembly Manual.html" _site/bom.html
          cp "CH32X035G8U6 Dev Board.jpg" _site/board.jpg
          cp "CH32X035 Schematic.png" _site/schematic.png
          cp "PCB For CH32X035G8U6 USB PD Development Board.jpg" _site/pcb.jpg

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
